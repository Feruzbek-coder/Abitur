{% extends "exams/base.html" %}
{% block title %}{{ exercise.title }} - Bo'sh joy{% endblock %}

{% block extra_css %}
<style>
    body { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%) !important; min-height: 100vh; }
    .game-wrapper { max-width: 750px; margin: 30px auto; padding: 0 15px; }
    .main-card { background: white; border-radius: 25px; padding: 35px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
    .progress-bar-custom { height: 8px; background: #e2e8f0; border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
    .progress-fill { height: 100%; background: linear-gradient(135deg, #4facfe, #00f2fe); border-radius: 10px; transition: width 0.4s; }
    .question-num { color: #4facfe; font-weight: 700; font-size: 0.9rem; letter-spacing: 1px; text-transform: uppercase; }
    .gap-sentence { font-size: 1.3rem; color: #1e293b; margin-bottom: 20px; line-height: 2; }
    .gap-input {
        border: none; border-bottom: 3px solid #4facfe;
        font-size: 1.2rem; font-weight: 600; color: #1e293b;
        width: 150px; text-align: center; outline: none; padding: 3px 5px;
        display: inline-block; background: transparent;
    }
    .gap-input.correct { border-bottom-color: #22c55e; color: #166534; }
    .gap-input.wrong { border-bottom-color: #ef4444; color: #7f1d1d; }
    .score-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .score-badge { background: linear-gradient(135deg, #4facfe, #00f2fe); color: white; padding: 6px 18px; border-radius: 20px; font-weight: 700; font-size: 1rem; }
    .feedback { text-align: center; padding: 12px; border-radius: 12px; font-weight: 600; margin-top: 10px; display: none; }
    .correct-fb { background: #dcfce7; color: #166534; }
    .wrong-fb { background: #fee2e2; color: #7f1d1d; }
    .results-screen { text-align: center; padding: 20px 0; }
    .results-circle { width: 140px; height: 140px; border-radius: 50%; background: linear-gradient(135deg, #4facfe, #00f2fe); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 20px auto; font-size: 2rem; font-weight: 900; box-shadow: 0 10px 30px rgba(79,172,254,0.5); }
</style>
{% endblock %}

{% block content %}
<div class="game-wrapper">
    <h4 class="text-white fw-bold mb-3 text-center">{{ exercise.title }}</h4>

    <div class="main-card" id="gameCard">
        <div class="score-header">
            <div class="question-num" id="questionNum">1 / {{ questions|length }}</div>
            <div class="score-badge">Ball: <span id="scoreDisplay">0</span></div>
        </div>
        <div class="progress-bar-custom">
            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>

        <div id="questionText" class="text-muted mb-3"></div>
        <div id="sentenceContainer" class="gap-sentence"></div>
        <div class="feedback" id="feedback"></div>

        <div class="d-flex gap-2 mt-3">
            <button id="checkBtn" class="btn btn-primary px-4" onclick="checkAnswer()">Tekshirish ✓</button>
            <button id="nextBtn" class="btn btn-outline-primary px-4" style="display:none;" onclick="nextQuestion()">Keyingi →</button>
        </div>
    </div>

    <div class="main-card results-screen" id="resultsCard" style="display:none;">
        <h2 style="color:#1e293b;">🎉 Bajarildi!</h2>
        <div class="results-circle" id="resultCircle"></div>
        <h4 id="resultText" class="text-muted mb-4"></h4>
        <div class="d-flex gap-3 justify-content-center flex-wrap">
            <button onclick="restartGame()" class="btn btn-primary px-4">🔄 Qayta</button>
            <a href="{% url 'edukids:exercises_index' %}" class="btn btn-outline-secondary px-4">← Mashqlar</a>
        </div>
    </div>
</div>

<script>
const questions = {{ questions_json|safe }};
let current = 0, score = 0, startTime = Date.now();

function showQuestion(idx) {
    const q = questions[idx];
    const total = questions.length;
    document.getElementById('questionNum').textContent = (idx + 1) + ' / ' + total;
    document.getElementById('progressFill').style.width = ((idx / total) * 100) + '%';
    document.getElementById('questionText').textContent = q.question_text || '';
    document.getElementById('feedback').style.display = 'none';
    document.getElementById('checkBtn').style.display = 'inline-block';
    document.getElementById('nextBtn').style.display = 'none';

    const gapText = q.gap_text || q.question_text;
    const sentence = document.getElementById('sentenceContainer');
    // Replace ___ with input
    const parts = gapText.split('___');
    sentence.innerHTML = '';
    parts.forEach((part, i) => {
        sentence.appendChild(document.createTextNode(part));
        if (i < parts.length - 1) {
            const inp = document.createElement('input');
            inp.className = 'gap-input';
            inp.id = 'gapInput';
            inp.placeholder = '?';
            inp.addEventListener('keydown', e => { if (e.key === 'Enter') checkAnswer(); });
            sentence.appendChild(inp);
        }
    });
    setTimeout(() => {
        const inp = document.getElementById('gapInput');
        if (inp) inp.focus();
    }, 50);
}

function checkAnswer() {
    const q = questions[current];
    const inp = document.getElementById('gapInput');
    if (!inp) return;
    const answer = inp.value.trim().toLowerCase();
    const correct = q.correct_answer.trim().toLowerCase();
    const fb = document.getElementById('feedback');
    fb.style.display = 'block';
    document.getElementById('checkBtn').style.display = 'none';
    document.getElementById('nextBtn').style.display = 'inline-block';
    if (answer === correct) {
        inp.classList.add('correct');
        fb.className = 'feedback correct-fb';
        fb.textContent = '✅ To\'g\'ri! +' + q.points + ' ball';
        score += q.points;
        document.getElementById('scoreDisplay').textContent = score;
    } else {
        inp.classList.add('wrong');
        fb.className = 'feedback wrong-fb';
        fb.textContent = '❌ Noto\'g\'ri! To\'g\'ri javob: ' + q.correct_answer;
        inp.value = q.correct_answer;
    }
    inp.readOnly = true;
}

function nextQuestion() {
    current++;
    if (current < questions.length) showQuestion(current);
    else showResults();
}

function showResults() {
    document.getElementById('gameCard').style.display = 'none';
    document.getElementById('resultsCard').style.display = 'block';
    const total = questions.length * 10;
    const pct = total > 0 ? Math.round(score / total * 100) : 0;
    document.getElementById('resultCircle').innerHTML = pct + '%';
    const msg = pct >= 80 ? '🏆 Ajoyib!' : pct >= 60 ? '👍 Yaxshi!' : '💪 Yana mashq qiling!';
    document.getElementById('resultText').textContent = msg;
    const timeSpent = Math.round((Date.now() - startTime) / 1000);
    fetch('{% url "edukids:exercise_submit" exercise.id %}', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}'},
        body: JSON.stringify({score: score, total: total, time_spent: timeSpent})
    });
}

function restartGame() {
    current = 0; score = 0; startTime = Date.now();
    document.getElementById('scoreDisplay').textContent = 0;
    document.getElementById('gameCard').style.display = 'block';
    document.getElementById('resultsCard').style.display = 'none';
    showQuestion(0);
}

if (questions.length > 0) showQuestion(0);
</script>
{% endblock %}
